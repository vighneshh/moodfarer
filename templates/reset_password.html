{% extends "auth_base.html" %}
{% block title %}Choose a new password{% endblock %}

{% block content %}
<div class="rounded-3xl bg-card border border-line shadow-soft p-6">
  <h2 class="font-semibold text-lg">Choose a new password</h2>
  <p class="text-ink-soft text-sm mt-1">Make it something you'll remember.</p>

  <form method="POST" class="mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="password" class="block text-sm font-medium text-ink-soft mb-1.5">New password</label>
      <input type="password" id="password" name="password" required autofocus autocomplete="new-password" minlength="8"
             class="w-full rounded-2xl border border-line px-4 py-3.5 text-[15px] focus:outline-none focus:ring-2 focus:ring-moss-400 focus:border-transparent">
      <p class="text-xs text-ink-faint mt-1.5">At least 8 characters.</p>
    </div>
    <div>
      <label for="confirm_password" class="block text-sm font-medium text-ink-soft mb-1.5">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="8"
             class="w-full rounded-2xl border border-line px-4 py-3.5 text-[15px] focus:outline-none focus:ring-2 focus:ring-moss-400 focus:border-transparent">
    </div>

    <button type="submit"
            class="w-full rounded-2xl bg-moss-500 py-3.5 font-medium text-white active:scale-[0.99] transition-transform">
      Reset password
    </button>
  </form>
</div>
{% endblock %}
