<!DOCTYPE html>
<html lang="en" class="h-full" data-theme-pref="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Check-in{% endblock %}</title>
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
  (function () {
    var stored = localStorage.getItem('theme');
    var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', isDark);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper: 'var(--color-paper)', card: 'var(--color-card)', ink: 'var(--color-ink)',
          'ink-soft': 'var(--color-ink-soft)', 'ink-faint': 'var(--color-ink-faint)',
          moss: { 50: '#EEF3EC', 100: '#DCE7D8', 200: '#BBD0B4', 300: '#93B589', 400: '#6B9660', 500: '#4F6F52', 600: '#3E5941', 700: '#324833' },
          ochre: '#C98A4B', amber: '#D7A94A', clay: '#CC7A3B', brick: '#B5563F', maroon: '#8B3A3A',
          line: 'var(--color-line)',
        },
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'], display: ['Fraunces', 'ui-serif', 'serif'] },
        boxShadow: { soft: '0 1px 2px rgba(35, 38, 31, 0.04), 0 8px 24px -12px rgba(35, 38, 31, 0.10)', lift: '0 2px 4px rgba(35, 38, 31, 0.05), 0 16px 32px -16px rgba(35, 38, 31, 0.16)' },
        borderRadius: { '2xl': '1.25rem', '3xl': '1.75rem' },
      },
    },
  };
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="h-full bg-paper text-ink font-sans antialiased">

<div class="min-h-full flex flex-col items-center justify-center px-5 py-10">
  <div class="w-full max-w-sm">

    <div class="flex flex-col items-center mb-8">
      <span class="w-11 h-11 rounded-2xl bg-moss-500 flex items-center justify-center">
        <span class="w-3 h-3 rounded-full bg-moss-100"></span>
      </span>
      <h1 class="mt-4 font-semibold text-lg tracking-tight">Daily Check-in</h1>
    </div>

    {% if get_flashed_messages() %}
      <div class="mb-4 space-y-2">
        {% for category, message in get_flashed_messages(with_categories=true) %}
          <div class="rounded-2xl border px-4 py-3 text-sm {{ 'bg-[#FAEBE7] border-[#EFCFC5] text-brick' if category == 'error' else 'bg-moss-50 border-moss-100 text-moss-600' }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}

  </div>
</div>

</body>
</html>
